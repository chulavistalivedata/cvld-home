<!-- Paste this into Google Sites: Insert → Embed → Embed code -->
<div id="cvld-home-wrap" style="width:100%;max-width:1100px;margin:0 auto;">
  <iframe
    id="cvld-home"
    title="Chula Vista Live Data home"
    src="https://cdn.jsdelivr.net/gh/chulavistalivedata/cvld-home@main/index.html"
    style="width:100%;height:980px;border:0;overflow:hidden;"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
</div>
<script>
  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "cvld-home-resize") return;
    var frame = document.getElementById("cvld-home");
    if (frame) frame.style.height = event.data.height + "px";
  });
</script>
